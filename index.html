        }
        .school-card {

            { name: "朝陽科大", reg: "-", docDeadline: "-", exam: "-", hasExam: false, link: "https://drive.google.com/file/d/17FwP4D3onLn8clUrJ_GGB7KnX-6SWIcD/view?usp=sharing" }
        ];

        let currentView = 'card';

        function renderContent(dataToRender) {
            const cardContainer = document.getElementById('cardContainer');
            const tableBody = document.getElementById('tableBody');
            const noResults = document.getElementById('noResults');
            const schoolCount = document.getElementById('schoolCount');

            if (!cardContainer || !tableBody || !schoolCount) return;

            schoolCount.textContent = `共 ${dataToRender.length} 校`;

            if (dataToRender.length === 0) {
                cardContainer.innerHTML = '';
                tableBody.innerHTML = '';
                if (noResults) noResults.classList.remove('hidden');
                return;
            }

            if (noResults) noResults.classList.add('hidden');

            // Render Cards
            cardContainer.innerHTML = dataToRender.map(school => `
                <div class="school-card bg-white rounded-2xl p-5 border ${school.hasExam ? 'border-amber-300 bg-amber-50/30' : 'border-slate-200'} shadow-sm flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-100">115寒轉</span>
                            ${school.hasExam ? '<span class="text-xs font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-200">有筆試</span>' : ''}
                        </div>
                        <h4 class="text-lg font-bold text-slate-900 mb-3">${school.name}</h4>
                        ${school.reg !== '-' ? `
                            <div class="space-y-1.5 text-xs text-slate-600 bg-white p-3 rounded-xl mb-3 border border-slate-100 shadow-sm">
                                <div class="flex justify-between"><span>報名時間：</span><span class="font-semibold text-slate-800">${school.reg}</span></div>
                                <div class="flex justify-between"><span>書審截止：</span><span class="font-semibold text-slate-800">${school.docDeadline}</span></div>
                                <div class="flex justify-between"><span>筆試時間：</span><span class="font-semibold text-amber-700">${school.exam}</span></div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                        <span class="text-xs text-slate-400">${school.reg !== '-' ? '已有詳細時程' : '詳見官方簡章說明'}</span>
                        <a href="${school.link}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center gap-1.5 px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl transition shadow-sm">
                            <span>查看簡章</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </div>
                </div>
            `).join('');

            // Render Table Rows
            tableBody.innerHTML = dataToRender.map(school => `
                <tr class="transition h-12 ${school.hasExam ? 'bg-amber-50/70 hover:bg-amber-100/60 font-medium' : 'hover:bg-slate-50'}">
                    <td class="py-3 px-4 font-semibold text-slate-900 flex items-center justify-center gap-2">
                        ${school.hasExam ? '<span class="w-2 h-2 rounded-full bg-amber-500"></span>' : ''}
                        ${school.name}
                    </td>
                    <td class="py-3 px-4 text-slate-600">${school.reg}</td>
                    <td class="py-3 px-4 text-slate-600">${school.docDeadline}</td>
                    <td class="py-3 px-4 text-slate-600">${school.exam}</td>
                    <td class="py-3 px-4">
                        <a href="${school.link}" target="_blank" rel="noopener noreferrer" 
                           class="inline-block bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-full transition shadow-sm">
                            查看簡章
                        </a>
                    </td>
                </tr>
            `).join('');
        }

        function toggleView(view) {
            currentView = view;
            const cardContainer = document.getElementById('cardContainer');
            const tableContainer = document.getElementById('tableContainer');
            const cardViewBtn = document.getElementById('cardViewBtn');
            const tableViewBtn = document.getElementById('tableViewBtn');

            if (view === 'card') {
                cardContainer.classList.remove('hidden');
                tableContainer.classList.add('hidden');
                cardViewBtn.className = "p-2 rounded-lg bg-blue-600 text-white transition shadow-sm";
                tableViewBtn.className = "p-2 rounded-lg bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 transition shadow-sm";
            } else {
                cardContainer.classList.add('hidden');
                tableContainer.classList.remove('hidden');
                tableViewBtn.className = "p-2 rounded-lg bg-blue-600 text-white transition shadow-sm";
                cardViewBtn.className = "p-2 rounded-lg bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 transition shadow-sm";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderContent(schoolsData);

            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    const filtered = schoolsData.filter(school => 
                        school.name.toLowerCase().includes(query)
                    );
                    renderContent(filtered);
                });
            }
        });

        function clearSearch() {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';
            renderContent(schoolsData);
        }
    </script>
</body>
</html>
